<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSH · Netboard</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/static/favicon.ico">
<link rel="stylesheet" href="/static/vendor/xterm.css">
<style>
  :root{
    --paper:#F6F6F4; --surface:#FFFFFF; --sunk:#EFEFEC;
    --ink:#17191E; --ink2:#5B616E; --ink3:#8A909C;
    --rule:#E3E3DE; --rule2:#D2D2CC; --link:#20489B; --dead:#B4291F;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --shadow:0 1px 2px rgba(0,0,0,.05), 0 8px 30px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#131417; --surface:#191B1F; --sunk:#202329;
      --ink:#E9EAEC; --ink2:#9BA1AD; --ink3:#6D7380;
      --rule:#2A2D34; --rule2:#3A3E47; --link:#8FB0F0; --dead:#E0736A;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 40px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box}
  /* Ohne das überstimmt jedes display: das hidden-Attribut – eine unsichtbare
     Ebene läge dann über der Bedienung. */
  [hidden]{display:none!important}
  html,body{height:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--sans); font-size:14px;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
  }
  :focus-visible{outline:2px solid var(--link); outline-offset:2px; border-radius:3px}

  header{
    background:var(--surface); border-bottom:1px solid var(--rule);
    padding:0 18px; height:46px; flex:none;
    display:flex; align-items:center; gap:12px;
  }
  .mark{font:600 11px/1 var(--mono); letter-spacing:.2em; text-transform:uppercase;
    color:var(--ink3)}
  .who{font:12px/1 var(--mono); color:var(--ink2); overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap}
  .who b{color:var(--ink); font-weight:600}
  .grow{flex:1}
  .state{
    font:600 10px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink3); border:1px solid var(--rule2); border-radius:4px;
    padding:4px 7px; white-space:nowrap;
  }
  .state.live{color:var(--link); border-color:var(--link)}
  .state.gone{color:var(--dead); border-color:var(--dead)}
  .btn{
    font:600 12px/1 var(--mono); letter-spacing:.06em; color:var(--ink);
    background:var(--surface); border:1px solid var(--rule2);
    border-radius:6px; padding:8px 12px; cursor:pointer; white-space:nowrap;
  }
  .btn:hover:not(:disabled){background:var(--sunk)}
  .btn:disabled{color:var(--ink3); cursor:progress}
  .btn.pri{background:var(--ink); color:var(--paper); border-color:var(--ink)}
  .btn.pri:hover:not(:disabled){opacity:.85}

  /* Anmeldung */
  #gate{flex:1; display:flex; align-items:center; justify-content:center; padding:28px 20px}
  .card{
    width:100%; max-width:420px; background:var(--surface);
    border:1px solid var(--rule); border-radius:14px;
    box-shadow:var(--shadow); padding:32px 32px 24px;
  }
  .card h1{margin:0 0 6px; font-size:21px; letter-spacing:-.02em; font-weight:600}
  .card .lede{margin:0 0 22px; color:var(--ink2); font-size:13px; line-height:1.5}
  .card .lede code{font-family:var(--mono); font-size:12px; color:var(--ink)}
  label.lbl{display:block; font:600 11px/1 var(--mono); letter-spacing:.12em;
    text-transform:uppercase; color:var(--ink2); margin-bottom:7px}
  input{
    width:100%; font:13px/1.4 var(--mono); color:var(--ink);
    background:var(--surface); border:1px solid var(--rule2);
    border-radius:6px; padding:10px 12px; margin-bottom:14px;
  }
  input:focus{outline:none; border-color:var(--link)}
  .err{
    background:var(--surface); border:1px solid var(--dead); border-left-width:3px;
    border-radius:5px; padding:10px 12px; margin-bottom:16px;
    font-size:12.5px; color:var(--dead); white-space:pre-wrap;
  }
  .note{font-size:11.5px; color:var(--ink3); line-height:1.5; margin-top:14px;
    padding-top:14px; border-top:1px solid var(--rule)}

  /* Terminal */
  #term{flex:1; min-height:0; padding:8px 10px; background:var(--surface)}
  #term .xterm{height:100%}
  #bye{
    position:absolute; inset:46px 0 0 0; display:flex; align-items:center;
    justify-content:center; background:rgba(0,0,0,.45); z-index:5;
  }
  #bye .card{max-width:340px; text-align:center}
</style>
</head>
<body>
<header>
  <span class="mark">SSH</span>
  <span class="who" id="who">–</span>
  <span class="grow"></span>
  <span class="state" id="st">Nicht verbunden</span>
  <button class="btn" id="again" hidden>Erneut verbinden</button>
</header>

<div id="gate">
  <div class="card">
    <h1>Terminal öffnen</h1>
    <p class="lede">Sitzung auf <code id="tgt">–</code></p>
    <div id="err"></div>
    <label class="lbl" for="u">Benutzername</label>
    <input id="u" autocomplete="username" spellcheck="false" autocapitalize="off">
    <label class="lbl" for="p">Passwort</label>
    <input id="p" type="password" autocomplete="current-password">
    <button class="btn pri" id="go" style="width:100%">Verbinden</button>
    <p class="note">Das Passwort wird nur zum Aufbau der Sitzung durchgereicht
      und nirgends gespeichert. Gemerkt wird allein der Benutzername, damit du
      ihn beim nächsten Mal nicht tippen musst.</p>
  </div>
</div>

<div id="term" hidden></div>
<div id="bye" hidden>
  <div class="card">
    <h1>Sitzung beendet</h1>
    <p class="lede" id="byew">Die Verbindung wurde geschlossen.</p>
    <button class="btn pri" id="byeb" style="width:100%">Erneut verbinden</button>
  </div>
</div>

<script src="/static/vendor/xterm.js"></script>
<script src="/static/vendor/addon-fit.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const P = new URLSearchParams(location.search);
const HOST = P.get("host") || "";
const PORT = parseInt(P.get("port") || "22", 10);
const NAME = P.get("name") || HOST;

document.title = `SSH · ${NAME}`;
$("#tgt").textContent = `${HOST}:${PORT}`;
$("#who").innerHTML = `<b>${NAME}</b> · ${HOST}:${PORT}`;

let term = null, fit = null, ws = null;

// Benutzernamen vorbelegen – der Server merkt ihn sich pro Gerät.
(async () => {
  try{
    const r = await fetch("/api/ssh/user?host=" + encodeURIComponent(HOST));
    const d = await r.json();
    if(d && d.user) $("#u").value = d.user;
  }catch(e){}
  ($("#u").value ? $("#p") : $("#u")).focus();
})();

function setState(text, cls){
  const el = $("#st");
  el.textContent = text;
  el.className = "state" + (cls ? " " + cls : "");
}

function showErr(msg){
  $("#err").innerHTML = `<div class="err">${msg}</div>`;
}

function openTerm(){
  $("#gate").hidden = true;
  $("#term").hidden = false;
  if(term) return;
  term = new Terminal({
    fontFamily: getComputedStyle(document.body).getPropertyValue("--mono"),
    fontSize: 13, cursorBlink: true, scrollback: 5000,
    theme: matchMedia("(prefers-color-scheme: dark)").matches
      ? { background:"#191B1F", foreground:"#E9EAEC", cursor:"#8FB0F0" }
      : { background:"#FFFFFF", foreground:"#17191E", cursor:"#20489B",
          selectionBackground:"#CBD9F5" },
  });
  fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open($("#term"));
  fit.fit();
  term.onData(d => { if(ws && ws.readyState === 1) ws.send("d" + d); });
  addEventListener("resize", () => {
    if(!fit) return;
    fit.fit();
    if(ws && ws.readyState === 1)
      ws.send("r" + JSON.stringify({cols: term.cols, rows: term.rows}));
  });
}

function connect(){
  const user = $("#u").value.trim();
  const pass = $("#p").value;
  if(!user) return showErr("Bitte einen Benutzernamen angeben.");

  $("#go").disabled = true;
  $("#err").innerHTML = "";
  setState("Verbinde …");
  openTerm();
  term.clear();

  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(`${proto}//${location.host}/ws/ssh`);
  let live = false;   // erst nach dem Bereit-Zeichen ist alles echte Ausgabe

  ws.onopen = () => {
    ws.send(JSON.stringify({ host: HOST, port: PORT, user, password: pass,
                             cols: term.cols, rows: term.rows }));
    $("#p").value = "";           // Passwort nicht im Feld liegen lassen
  };
  ws.onmessage = e => {
    if(!live && e.data === "\x01"){        // Sitzung steht
      live = true;
      setState("Verbunden", "live");
      term.focus();
      return;
    }
    term.write(e.data);
  };
  ws.onerror = () => setState("Fehler", "gone");
  ws.onclose = e => {
    $("#go").disabled = false;
    $("#again").hidden = false;
    setState("Getrennt", "gone");
    // Kam es nie zur Sitzung, lag es an Anmeldung oder Ziel -> zurück zur Maske.
    if(!live){
      $("#term").hidden = true;
      $("#gate").hidden = false;
      showErr(e.reason || "Verbindung nicht zustande gekommen.");
      $("#p").focus();
      return;
    }
    $("#byew").textContent = `Die Verbindung zu ${NAME} wurde geschlossen.`;
    $("#bye").hidden = false;
  };
}

$("#go").addEventListener("click", connect);
["u","p"].forEach(id => $("#"+id).addEventListener("keydown", e => {
  if(e.key === "Enter") connect();
}));
$("#again").addEventListener("click", () => location.reload());
$("#byeb").addEventListener("click", () => location.reload());
</script>
</body>
</html>
